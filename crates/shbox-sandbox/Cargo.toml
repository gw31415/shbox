[package]
name = "shbox-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Linux/macOS process sandbox primitives: Landlock, seccomp, cgroup v2, namespaces, Seatbelt"
publish = false

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
tempfile = "3"
