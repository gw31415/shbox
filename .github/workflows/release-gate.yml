name: Release gate

on:
  # Full native validation is intentionally release-only because the
  # Linux/macOS matrix is expensive. A version tag is the automatic release
  # gate; workflow_dispatch remains available for deliberate preflight runs.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust-quality:
    name: Rust ${{ matrix.toolchain }} quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - '1.95.0'
          - stable
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Validate platform gate scripts
        run: |
          set -euo pipefail
          test -x scripts/verify-linux-platform
          test -x scripts/verify-macos-platform
          bash -n scripts/verify-linux-platform
          bash -n scripts/verify-macos-platform
      - name: Reject retired production backends and cgroup control paths
        run: |
          set -euo pipefail
          if grep -RInEi 'arapuca|sandlock|shbox-sandbox-runner|linux_runner_protocol' src Cargo.toml Cargo.lock deploy; then
            echo 'retired sandbox backend/runner reference found in production inputs' >&2
            exit 1
          fi
          if grep -RInE 'ARAPUCA_|NONO_|selfexec' src Cargo.toml deploy; then
            echo 'retired launcher control/selfexec path found in production inputs' >&2
            exit 1
          fi
          if grep -RInE '/sys/fs/cgroup|cgroup\.procs|cgroup\.subtree_control|Delegate=' src Cargo.toml deploy; then
            echo 'sandbox cgroup control path found in production inputs' >&2
            exit 1
          fi
          if grep -RInE 'Command::new\([^)]*(nono|arapuca)' src; then
            echo 'external sandbox CLI invocation found in production source' >&2
            exit 1
          fi
      - name: Check the locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=1
      - name: Build
        run: cargo build --locked --all-targets

  supported-target-builds:
    name: Build ${{ matrix.target }} on Rust 1.95
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - name: Build supported target
        run: cargo build --locked --target ${{ matrix.target }}

  linux-platform:
    name: Linux ${{ matrix.arch }} native confinement gate
    needs:
      - rust-quality
      - supported-target-builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: '1.95.0'
      - name: Run blocking native nono/Landlock + OpenSSH/PTTY gate
        run: ./scripts/verify-linux-platform --arch ${{ matrix.arch }}

  macos-15-arm64:
    name: macOS 15 arm64 native Seatbelt gate
    needs:
      - rust-quality
      - supported-target-builds
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-darwin
      - name: Run blocking native Seatbelt + OpenSSH/PTTY gate
        run: ./scripts/verify-macos-platform --os 15

  macos-26-arm64:
    name: macOS 26 arm64 native Seatbelt gate
    needs:
      - rust-quality
      - supported-target-builds
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-darwin
      - name: Run blocking native Seatbelt + OpenSSH/PTTY gate
        run: ./scripts/verify-macos-platform --os 26
