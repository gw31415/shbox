name: M8 release gate

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m8-release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust-toolchains:
    name: Rust ${{ matrix.toolchain }} quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - '1.91.0'
          - stable
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Validate gate scripts
        run: |
          set -euo pipefail
          test -x scripts/verify-linux-platform
          test -x scripts/verify-macos-platform
          bash -n scripts/verify-linux-platform
          bash -n scripts/verify-macos-platform
      - name: Check the locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=1
      - name: Build
        run: cargo build --locked --all-targets

  supported-target-builds:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build supported target
        run: cargo build --locked --target ${{ matrix.target }}

  macos-15-arm64:
    name: macOS 15 arm64 gate
    needs:
      - rust-toolchains
      - supported-target-builds
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Run the blocking platform gate
        run: ./scripts/verify-macos-platform --os 15

  macos-26-arm64:
    name: macOS 26 arm64 gate
    needs:
      - rust-toolchains
      - supported-target-builds
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master, reviewed 2026-06-24
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Run the blocking platform gate
        run: ./scripts/verify-macos-platform --os 26
