[package]
name = "shbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Foreground SSH daemon that maps OpenSSH clients onto persistent Arapuca sandbox workspaces"
publish = false

[dependencies]
arapuca = { git = "https://github.com/LeGambiArt/arapuca", rev = "c94802c4d8b6b880334c0d643b16b7326ec7f039" }
libc = "0.2"
nix = { version = "0.31", features = ["term"] }
rand = { version = "0.10", features = ["thread_rng"] }
russh = { version = "=0.63.1", default-features = false, features = ["ring"] }
ssh-key = { version = "=0.7.0-rc.11", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_with = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "time"] }
usage-rs = { package = "usage-rs", version = "=6.5.0", features = ["completions"] }
usage-lib = "=6.5.0"
xdg = "=3.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
nono = { version = "=0.74.0", default-features = false }

[dev-dependencies]
proptest = "1"
ssh-encoding = "0.3.0"
tempfile = "3"
